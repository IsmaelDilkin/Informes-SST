function lines(S,meses,m){const W=560,H=250,L=44,B=34,T=10,R=12,top=m=='cump'?100:Math.max(1,...S.flatMap(s=>s.pts.map(p=>p.v)))*1.15,X=k=>meses.length<2?L+(W-L-R)/2:L+meses.indexOf(k)*(W-L-R)/(meses.length-1),Y=v=>T+(H-T-B)*(1-v/top),st=Math.ceil(meses.length/8);
